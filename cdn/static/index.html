        <link rel="icon" type="image/png" href="https://axel669.net/images/megaman-rounded.png" />
        <title>Wind CDN</title>

    <body>
        <style>
            @font-face {
                font-family: Tektur;

                margin: 0px;

                overflow: hidden;

        <div style="display: flex; margin: auto; width: min(320px, 100%);">
